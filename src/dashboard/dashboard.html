<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebNote</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="../../assets/icons/icon48.png" alt="" class="brand-logo" />
          <div>
            <div class="brand-name">WebNote</div>
            <div class="brand-sub" data-i18n="dash.title">我的标注库</div>
          </div>
        </div>

        <div class="search">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input id="search" type="search" data-i18n-placeholder="dash.search" placeholder="搜索页面、原文或批注" autocomplete="off" />
        </div>

        <div class="tree-head">
          <span data-i18n="dash.tags">标签</span>
          <button class="icon-btn" id="btnNewTag" data-i18n-title="dash.newTag" title="新建标签">＋</button>
        </div>

        <nav class="tree" id="tree"></nav>

        <div class="side-stats" id="sideStats"></div>

        <div class="side-foot">
          <button class="side-btn" id="btnExport" data-i18n="dash.export" data-i18n-title="dash.exportTitle" title="导出为 JSON 备份">导出</button>
          <button class="side-btn" id="btnImport" data-i18n="dash.import" data-i18n-title="dash.importTitle" title="从 JSON 备份恢复">导入</button>
          <button class="side-btn" id="btnSettings" data-i18n="dash.settings" data-i18n-title="dash.settings" title="设置">设置</button>
        </div>
        <input type="file" id="fileInput" accept="application/json" hidden />
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-text">
            <h1 id="viewTitle" data-i18n="dash.allPages">全部页面</h1>
            <div class="view-sub" id="viewSub"></div>
          </div>
          <div class="topbar-actions">
            <select id="sort" class="select" data-i18n-title="dash.sortLabel" title="排序方式">
              <option value="updated" data-i18n="dash.sort.updated">最近更新</option>
              <option value="created" data-i18n="dash.sort.created">最近保存</option>
              <option value="count" data-i18n="dash.sort.count">标注最多</option>
              <option value="title" data-i18n="dash.sort.title">按标题</option>
            </select>
          </div>
        </header>

        <div class="contents" id="contents"></div>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toast" id="toast"></div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/model.js"></script>
    <script src="../shared/store.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
